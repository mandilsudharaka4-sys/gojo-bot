
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VITHUSHA CRASHER BOT</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #030003;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: white;
}

/* HORROR BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    background:
    radial-gradient(circle at 50% 50%, #310009 0%, #100006 35%, #030003 75%);
    z-index: -3;
}

.background::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(255,0,40,.025) 4px
    );
}

.glow {
    position: fixed;
    width: 350px;
    height: 350px;
    background: #ff003c;
    filter: blur(150px);
    opacity: .16;
    border-radius: 50%;
    animation: glowmove 6s infinite alternate;
    z-index: -2;
}

@keyframes glowmove {
    from { transform: translate(-100px,-100px); }
    to { transform: translate(150px,150px); }
}

/* PARTICLES */

.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
}

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #ff003c;
    border-radius: 50%;
    box-shadow: 0 0 12px #ff003c;
    animation: float 7s linear infinite;
}

@keyframes float {
    from {
        transform: translateY(110vh);
        opacity: 0;
    }
    to {
        transform: translateY(-10vh);
        opacity: 1;
    }
}

/* MAIN CONTAINER */

.container {
    width: 100%;
    max-width: 410px;
    padding: 20px;
    animation: appear 1s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(40px) scale(.9);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.card {
    position: relative;
    padding: 32px 24px;
    text-align: center;
    background: rgba(15, 0, 7, .88);
    border: 1px solid rgba(255,0,55,.55);
    border-radius: 22px;
    box-shadow:
        0 0 20px rgba(255,0,55,.22),
        0 0 70px rgba(255,0,55,.12),
        inset 0 0 25px rgba(255,0,55,.05);
    overflow: hidden;
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ff003c, transparent);
    animation: scan 4s linear infinite;
}

@keyframes scan {
    to { left: 100%; }
}

/* LOGO */

.logo {
    width: 85px;
    height: 85px;
    margin: auto;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    border: 2px solid #ff003c;
    color: #ff003c;
    font-size: 35px;
    box-shadow: 0 0 25px #ff003c;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    50% {
        box-shadow: 0 0 10px #ff003c, 0 0 45px #ff003c;
        transform: scale(1.05);
    }
}

h1 {
    margin-top: 22px;
    font-size: 25px;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 10px #ff003c, 0 0 25px #ff003c;
    animation: glitch 3s infinite;
}

@keyframes glitch {
    0%, 90%, 100% { transform: none; }
    92% { transform: translateX(-2px); }
    94% { transform: translateX(2px); }
}

.subtitle {
    color: #ff315b;
    font-size: 11px;
    letter-spacing: 3px;
    margin-top: 12px;
    font-weight: bold;
}

.creator {
    margin-top: 9px;
    font-size: 12px;
    color: #999;
}

.line {
    height: 1px;
    margin: 25px 0;
    background: linear-gradient(90deg, transparent, #ff003c, transparent);
}

/* INPUT */

.label {
    display: block;
    text-align: left;
    font-size: 12px;
    color: #ff5473;
    margin-bottom: 10px;
    letter-spacing: 1px;
}

.input-box {
    display: flex;
    background: #090307;
    border: 1px solid #6c001b;
    border-radius: 12px;
    overflow: hidden;
    transition: .3s;
}

.input-box:focus-within {
    border-color: #ff003c;
    box-shadow: 0 0 18px rgba(255,0,55,.3);
}

.input-box i {
    padding: 17px 14px;
    color: #ff003c;
}

input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 15px;
    padding-right: 12px;
}

input::placeholder {
    color: #686068;
}

/* BUTTON */

button {
    width: 100%;
    margin-top: 18px;
    height: 52px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #8b001e, #ff003c);
    color: white;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,0,55,.3);
    transition: .3s;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 30px #ff003c;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
    transform: none;
}

/* RESULT */

#result {
    margin-top: 20px;
}

.message {
    color: #ff7890;
    font-size: 13px;
    margin-bottom: 12px;
}

.code-box {
    padding: 18px 10px;
    border: 1px dashed #ff003c;
    background: rgba(255,0,55,.07);
    border-radius: 12px;
}

.code {
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 5px;
    color: white;
    text-shadow: 0 0 15px #ff003c;
}

.copy-btn {
    background: #160008;
    border: 1px solid #ff003c;
    box-shadow: none;
    margin-top: 12px;
}

.loader {
    width: 30px;
    height: 30px;
    border: 3px solid #400013;
    border-top: 3px solid #ff003c;
    border-radius: 50%;
    margin: 15px auto;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.footer {
    margin-top: 25px;
    font-size: 10px;
    color: #777;
    letter-spacing: 2px;
}

.footer span {
    color: #ff003c;
}

@media(max-width:380px) {
    .card { padding: 27px 17px; }
    h1 { font-size: 21px; }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="glow"></div>
<div class="particles" id="particles"></div>

<div class="container">
<div class="card">

    <div class="logo">
        <i class="fas fa-skull"></i>
    </div>

    <h1>VITHUSHA CRASHER</h1>

    <div class="subtitle">DARKNESS IS HERE</div>

    <div class="creator">
        POWERED BY VITHUSHA DAMSATH
    </div>

    <div class="line"></div>

    <label class="label">
        <i class="fas fa-phone"></i>
        WHATSAPP NUMBER
    </label>

    <div class="input-box">
        <i class="fas fa-mobile-alt"></i>
        <input
            type="tel"
            id="number"
            placeholder="9476XXXXXXX"
            maxlength="15"
            autocomplete="tel"
        >
    </div>

    <button id="submit">
        <i class="fas fa-bolt"></i>
        GENERATE PAIR CODE
    </button>

    <div id="result"></div>

    <div class="footer">
        <span>●</span> SYSTEM ONLINE
        <br><br>
        VITHUSHA CRASHER BOT © 2026
    </div>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>

<script>
const numberInput = document.getElementById("number");
const submitBtn = document.getElementById("submit");
const result = document.getElementById("result");

let generatedCode = "";

function showError(message) {
    result.innerHTML = `
        <div class="message">
            <i class="fas fa-exclamation-circle"></i>
            ${message}
        </div>
    `;
}

async function copyCode() {
    if (!generatedCode) return;

    try {
        await navigator.clipboard.writeText(generatedCode);
        document.getElementById("copyBtn").innerHTML =
            '<i class="fas fa-check"></i> COPIED SUCCESSFULLY';
    } catch (error) {
        showError("Clipboard unavailable. Please copy the code manually.");
    }
}

submitBtn.addEventListener("click", async () => {

    const number = numberInput.value.replace(/\D/g, "");

    if (!number) {
        showError("Please enter your WhatsApp number.");
        return;
    }

    if (number.length < 11 || number.length > 15) {
        showError("Please enter a valid number with country code.");
        return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> GENERATING...';

    result.innerHTML = `
        <div class="loader"></div>
        <div class="message">CONNECTING TO CRASHER SERVER...</div>
    `;

    try {

        const response = await axios.get(
            `/code?number=${encodeURIComponent(number)}`,
            { timeout: 60000 }
        );

        const code = response.data.code;

        if (!code) {
            throw new Error("Pairing code unavailable.");
        }

        generatedCode = code;

        result.innerHTML = `
            <div class="message">
                <i class="fas fa-check-circle"></i>
                PAIRING CODE GENERATED
            </div>

            <div class="code-box">
                <div class="code" id="pairCode"></div>
            </div>

            <button class="copy-btn" id="copyBtn">
                <i class="fas fa-copy"></i>
                COPY PAIR CODE
            </button>
        `;

        document.getElementById("pairCode").textContent = code;
        document.getElementById("copyBtn")
            .addEventListener("click", copyCode);

    } catch (error) {

        showError(
            error.response?.data?.error ||
            error.message ||
            "Server error. Please try again."
        );

    } finally {

        submitBtn.disabled = false;
        submitBtn.innerHTML =
            '<i class="fas fa-bolt"></i> GENERATE PAIR CODE';

    }
});

/* ENTER KEY */

numberInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") submitBtn.click();
});

/* HORROR PARTICLES */

const particles = document.getElementById("particles");

for (let i = 0; i < 65; i++) {
    const dot = document.createElement("div");
    dot.className = "particle";

    dot.style.left = Math.random() * 100 + "%";
    dot.style.animationDuration = (3 + Math.random() * 8) + "s";
    dot.style.animationDelay = Math.random() * 7 + "s";
    dot.style.opacity = Math.random();

    particles.appendChild(dot);
}
</script>

</body>
</html>
